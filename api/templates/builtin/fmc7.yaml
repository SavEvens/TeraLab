schema: 1
id: fmc7
name: Firepower Management Center 7
kind: qemu
license: AGPL-3.0-or-later
icon: Server.png
defaults:
  cpu: 4
  ram: 28672
  ethernet: 1
  console: vnc
options:
  description: 'Cisco Firepower Management Center Virtual (FMCv) 7.x; 28 GiB RAM is the vendor floor.'
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc,accel=kvm -cpu host -serial none -nographic -no-user-config -nodefaults -display none -vga std -rtc base=utc'
