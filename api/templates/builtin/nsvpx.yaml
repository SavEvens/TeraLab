# Derived from UNetLab template html/templates/nsvpx.php.
# Converted to YAML by TeraLab contributors, 2026-11-17.
schema: 1
id: nsvpx
name: nsvpx
kind: qemu
license: BSD-3-Clause
icon: 'Load Balancer.png'
defaults:
  cpu: 2
  ram: 2048
  ethernet: 4
  console: telnet
options:
  qemu_arch: x86_64
  qemu_version: 2.0.2
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
