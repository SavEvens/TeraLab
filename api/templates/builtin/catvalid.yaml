schema: 1
id: catvalid
name: Catalyst SD-WAN Validator
kind: qemu
license: AGPL-3.0-or-later
icon: Server.png
defaults:
  cpu: 2
  ram: 4096
  ethernet: 2
  console: telnet
options:
  description: 'Catalyst SD-WAN Validator (formerly vBond).'
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc,accel=kvm -cpu host -serial mon:stdio -nographic -no-user-config -nodefaults -rtc base=utc'
