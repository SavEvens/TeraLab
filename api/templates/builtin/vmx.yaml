schema: 1
id: vmx
name: vMX
kind: qemu
license: BSD-3-Clause
icon: JuniperMX.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 6
  console: telnet
options:
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic'
