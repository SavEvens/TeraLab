schema: 1
id: vtmgmt
name: vManage (Viptela)
kind: qemu
license: AGPL-3.0-or-later
icon: Server.png
defaults:
  cpu: 4
  ram: 32768
  ethernet: 2
  console: telnet
options:
  description: 'Legacy Viptela vManage id. Releases 20.12+ require 32 GiB RAM; EVE-NG ships 16 GiB.'
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc,accel=kvm -cpu host -serial mon:stdio -nographic -no-user-config -nodefaults -rtc base=utc'
