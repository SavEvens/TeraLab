schema: 1
id: sterra
name: S-Terra
kind: qemu
license: BSD-3-Clause
icon: Firewall.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 1
  console: vnc
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial none -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
