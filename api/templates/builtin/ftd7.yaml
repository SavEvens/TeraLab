schema: 1
id: ftd7
name: Firepower Threat Defense 7
kind: qemu
license: AGPL-3.0-or-later
icon: Firewall.png
defaults:
  cpu: 4
  ram: 8192
  ethernet: 6
  console: vnc
options:
  description: Cisco Firepower Threat Defense Virtual (FTDv) 7.x.
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc,accel=kvm -cpu host -serial none -nographic -no-user-config -nodefaults -display none -vga std -rtc base=utc'
