schema: 1
id: clearpass
name: ClearPass
kind: qemu
license: BSD-3-Clause
icon: 'Network Analyzer.png'
defaults:
  cpu: 2
  ram: 4096
  ethernet: 2
  console: vnc
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial none -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
