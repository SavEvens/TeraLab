schema: 1
id: cips
name: IPS
kind: qemu
license: BSD-3-Clause
icon: IPS.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 5
  console: telnet
options:
  qemu_arch: i386
  qemu_version: 1.3.1
  qemu_options: '-machine type=pc-1.0 -serial mon:stdio -nographic -nodefconfig -nodefaults -rtc base=utc -no-shutdown -boot order=c -smbios type=1,product=IPS-4240/4255,version=1.0,family=IPS-4240/4255'
