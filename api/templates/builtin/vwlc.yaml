schema: 1
id: vwlc
name: vWLC
kind: qemu
license: BSD-3-Clause
icon: vWLC.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 2
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -rtc base=utc'
