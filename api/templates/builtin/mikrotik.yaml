schema: 1
id: mikrotik
name: Mikrotik
kind: qemu
license: BSD-3-Clause
icon: Router.png
defaults:
  cpu: 1
  ram: 256
  ethernet: 4
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
