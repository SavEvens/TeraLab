schema: 1
id: veos
name: vEOS
kind: qemu
license: BSD-3-Clause
icon: AristaSW.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 4
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -display none -nodefconfig -rtc base=utc -boot order=d'
