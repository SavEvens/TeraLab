schema: 1
id: brocadevadx
name: vADX
kind: qemu
license: BSD-3-Clause
icon: Switch.png
defaults:
  cpu: 2
  ram: 2048
  ethernet: 4
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
