schema: 1
id: asav
name: ASAv
kind: qemu
license: BSD-3-Clause
icon: ASA.png
defaults:
  cpu: 1
  ram: 2048
  ethernet: 8
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
