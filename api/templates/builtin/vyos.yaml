# Derived from UNetLab template html/templates/vyos.php.
# Converted to YAML by TeraLab contributors, 2026-11-17.
schema: 1
id: vyos
name: VyOS
kind: qemu
license: BSD-3-Clause
icon: Router.png
defaults:
  cpu: 1
  ram: 512
  ethernet: 4
  console: telnet
options:
  url: 'http://vyos.net/'
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -rtc base=utc'
