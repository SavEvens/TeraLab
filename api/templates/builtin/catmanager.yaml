schema: 1
id: catmanager
name: Catalyst SD-WAN Manager
kind: qemu
license: AGPL-3.0-or-later
icon: Server.png
defaults:
  cpu: 4
  ram: 32768
  ethernet: 2
  console: telnet
options:
  description: 'Catalyst SD-WAN Manager (formerly vManage). Releases 20.12+ require 32 GiB RAM.'
  qemu_arch: x86_64
  qemu_nic: virtio-net-pci
  qemu_options: '-machine type=pc,accel=kvm -cpu host -serial mon:stdio -nographic -no-user-config -nodefaults -rtc base=utc'
