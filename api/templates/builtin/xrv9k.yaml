schema: 1
id: xrv9k
name: xrv9k
kind: qemu
license: BSD-3-Clause
icon: XR.png
defaults:
  cpu: 4
  ram: 16384
  ethernet: 4
  console: telnet
options:
  qemu_nic: virtio-net-pci
  qemu_arch: x86_64
  qemu_options: '-machine type=pc,accel=kvm,usb=off -serial mon:stdio -nographic -nodefconfig -nodefaults -rtc base=utc,driftfix=slew -global kvm-pit.lost_tick_policy=discard -no-hpet -realtime mlock=off -no-shutdown -boot order=c'
