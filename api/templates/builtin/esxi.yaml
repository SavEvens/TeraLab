schema: 1
id: esxi
name: esxi
kind: qemu
license: BSD-3-Clause
icon: Server.png
defaults:
  cpu: 2
  ram: 4096
  ethernet: 4
  console: vnc
options:
  qemu_arch: x86_64
  qemu_options: '-machine pc,accel=kvm -serial none -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
