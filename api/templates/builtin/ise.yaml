schema: 1
id: ise
name: ISE
kind: qemu
license: BSD-3-Clause
icon: ISE.png
defaults:
  cpu: 2
  ram: 4096
  ethernet: 1
  console: telnet
options:
  qemu_arch: x86_64
  qemu_options: '-machine type=pc-1.0,accel=kvm -serial mon:stdio -nographic -nodefconfig -nodefaults -display none -vga std -rtc base=utc'
