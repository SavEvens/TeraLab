name: CI

on:
  push:
    branches:
      - main
      - "v1.6-dev"
      - "feat/**"
      - "fix/**"
      - "security/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-policy:
    name: Artifact policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject research and test artifacts
        run: ./scripts/check-artifact-policy.sh --tracked

  licence:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SPDX headers
        run: ./scripts/check-licence-headers.sh

  php-lint:
    name: PHP lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - name: Lint tracked PHP
        run: ./scripts/php-lint.sh

  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: sqlite3, mbstring
          coverage: none
          tools: composer
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: composer lint
      - name: Static analysis
        run: composer stan
      - name: Tests
        run: composer test

  agent:
    name: Agent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: agent/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build ./...

  dynamips-package:
    name: Dynamips package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libelf-dev libpcap-dev
      - name: Build package
        run: ./packaging/dynamips/build.sh --work /tmp/dynamips-build --out /tmp/dynamips-dist
      - name: Verify package
        run: |
          dpkg-deb -c /tmp/dynamips-dist/teralab-dynamips_*.deb | grep /usr/bin/dynamips
          dpkg-deb -f /tmp/dynamips-dist/teralab-dynamips_*.deb Package Version Depends

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck TeraLab scripts
        run: |
          shellcheck \
            scripts/check-licence-headers.sh \
            scripts/check-artifact-policy.sh \
            scripts/php-lint.sh \
            scripts/check-secrets.sh \
            scripts/dev-vm.sh \
            scripts/setup-runtime-paths.sh \
            packaging/dynamips/build.sh \
            packaging/teralab/apply-state.sh \
            packaging/teralab/build-deb.sh \
            packaging/teralab/install.sh \
            packaging/teralab/postinst.sh \
            packaging/teralab/prerm.sh \
            packaging/teralab/postrm.sh \
            packaging/teralab/teralab-firewall \
            scripts/teralab-project-init.sh

  ui:
    name: UI build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser E2E
        run: npm run e2e

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Composer audit
        working-directory: api
        run: composer audit --locked --no-interaction
      - name: Go vulnerability check
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --no-fund
      - name: npm production audit
        working-directory: ui
        run: npm audit --omit=dev
      - name: npm dev toolchain audit
        working-directory: ui
        run: npm audit

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Release checks
        run: ./scripts/teralab-project-init.sh --check

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse tracked Python
        run: |
          python3 - <<'PY'
          import ast
          import glob
          for path in sorted(glob.glob("scripts/*.py")):
              with open(path, encoding="utf-8") as handle:
                  ast.parse(handle.read(), filename=path)
              print("ok", path)
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files
        run: ./scripts/check-secrets.sh
