#
# TeraLab Apache configuration template. packaging/teralab/apply-state.sh
# renders it by replacing the install-root placeholder with the real root
# (/opt/teralab for the Debian package) and installs the result as
# /etc/apache2/conf-available/teralab.conf. The package ships that rendered
# file as a dpkg conffile.
#
# The PHP handlers below override the distro-wide php8.4-fpm handler for these
# directories only: TeraLab runs in its own pool (teralab-api:teralab), while
# other vhosts keep the default pool. The directory scope is required so this
# does not become a server-wide handler.

# ---------------------------------------------------------------------------
# Server-wide hardening
# ---------------------------------------------------------------------------
# ServerTokens, ServerSignature and TraceEnable are server-config directives:
# Apache rejects them inside <VirtualHost> and <Directory>, so they cannot be
# scoped to the TeraLab aliases. They apply to this Apache instance. Debian
# ships conf-enabled/security.conf with "ServerTokens OS" and
# "ServerSignature On"; conf-enabled files load in alphabetical order and
# "teralab.conf" sorts after "security.conf", so these values win. Remove the
# three lines on a shared Apache host whose other vhosts need a different
# banner or TRACE policy; nothing else here depends on them.
#
# Guard: this is the only server-global part of the file. Everything below is
# scoped to the TeraLab directories, and disabling this configuration
# (a2disconf teralab) removes all of it.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# HSTS is deliberately NOT sent from this configuration. The default
# deployment terminates TLS at the edge (Cloudflare, or an operator's load
# balancer) and proxies plain HTTP to Apache; a Strict-Transport-Security
# header on a plain-HTTP response is ignored at best and can pin a broken
# HTTPS setup at worst. Set HSTS at the TLS edge:
#     Strict-Transport-Security: max-age=31536000; includeSubDomains
# Only when Apache itself terminates TLS, enable the guarded block below:
# <If "%{HTTPS} == 'on'">
#     Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
# </If>

Alias /api "@ROOT@/api/public"
<Directory "@ROOT@/api/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /api/index.php
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-teralab.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
<Directory "@ROOT@/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-teralab.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
Alias /about.php "@ROOT@/html/about.php"
Alias /images "@ROOT@/html/images"
<Directory "@ROOT@/html/images">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
Alias /themes "@ROOT@/html/themes"
<Directory "@ROOT@/html/themes">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
Alias /ui "@ROOT@/html/ui"
<Directory "@ROOT@/html/ui">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /ui/index.html
</Directory>

# ---------------------------------------------------------------------------
# Browser-facing response headers
# ---------------------------------------------------------------------------
# Scoped to the URLs this configuration actually serves: the Vue SPA (/ui/),
# the theme and image aliases, and the About page. A <LocationMatch> is used
# instead of <Directory> so the API is excluded by construction: /api is
# served from api/public and keeps its own, stricter headers from
# api/src/Http/Middleware/SecurityHeadersMiddleware.php (default-src 'none'),
# which these directives never touch. The legacy /api.php entry point is not
# matched either.
#
# "always" makes the headers apply to error responses and to the SPA
# FallbackResource (which is resolved as an internal redirect back into
# /ui/), not only to 2xx responses.
#
# The CSP allows the built Vite bundle ('self'), xterm/Vue inline styles,
# same-origin fetch/XHR plus the /ws/console and /ws/vnc WebSockets, and
# Cloudflare Turnstile (its loader script, its widget iframe, and its XHR
# endpoints at challenges.cloudflare.com). img-src keeps data: and blob: for
# icons, uploaded pictures and client-side downloads. object-src, base-uri
# and frame-ancestors are pinned off.
#
# mod_headers must be enabled; apply-state.sh runs "a2enmod headers". This
# block is intentionally not wrapped in <IfModule>: a host that lost
# mod_headers fails "apache2ctl -t" and refuses to start rather than quietly
# serving the UI without its headers.
<LocationMatch "^/(?:ui(?:/|$)|themes(?:/|$)|images(?:/|$)|about\.php$)">
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' wss: https://challenges.cloudflare.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
</LocationMatch>

# The console gateway (the agent on 127.0.0.1:8091) validates the WebSocket
# Origin against the request Host. With no allowlist it accepts only
# same-origin handshakes, so the public Host has to survive the proxy hop.
# mod_proxy otherwise rewrites Host to the backend address (127.0.0.1:8091),
# which can never equal the browser's Origin; ProxyPreserveHost forwards the
# Host the browser used. It is a server/vhost directive, so it covers the
# /ws/ proxies below, which are the only ProxyPass entries in this file.
#
# Behind an edge that rewrites Host (a load balancer that does not preserve
# it, or a tunnel), remove this line and give the agent the public origin
# instead:
#     Environment=TERALAB_CONSOLE_ALLOWED_ORIGINS=https://lab.example
# The value is a comma-separated list of scheme://host[:port]; the packaged
# unit ships it empty, which keeps the same-origin default.
ProxyPreserveHost On

ProxyPass        /ws/console ws://127.0.0.1:8091/ws
ProxyPassReverse /ws/console ws://127.0.0.1:8091/ws
ProxyPass        /ws/vnc ws://127.0.0.1:8091/vnc
ProxyPassReverse /ws/vnc ws://127.0.0.1:8091/vnc
ProxyPass        /ws/tcp ws://127.0.0.1:8091/tcp
ProxyPassReverse /ws/tcp ws://127.0.0.1:8091/tcp
