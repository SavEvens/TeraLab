;
; TeraLab PHP-FPM pool. Apache routes only this vhost's PHP to this socket
; (see teralab.apache.conf), so the API never executes in the shared www-data
; pool. The pool identity is teralab-api:teralab; the agent secret and the
; agent socket use the same group, which www-data is never a member of.
;
; php-fpm 8.4 has no per-pool umask directive. The owner-only umask is applied
; by the php8.4-fpm.service drop-in that apply-state.sh generates
; (UMask=0077); the API also pins database/backup modes explicitly.
[teralab]
user = teralab-api
group = teralab
listen = /run/php/php8.4-fpm-teralab.sock
listen.owner = teralab-api
listen.group = teralab
listen.mode = 0660
; Apache worker processes still run as www-data and need connect permission.
; Do not use listen.acl_users here: php-fpm ignores listen.owner/group when it
; is set. Instead, /usr/local/libexec/teralab/fpm-socket-acl is run by a
; php8.4-fpm ExecStartPost drop-in and adds a named user ACL for www-data.
; That is a socket ACL only: www-data stays out of the teralab group and
; cannot read /etc/teralab/agent.secret or reach /run/teralab/agent.sock.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500
security.limit_extensions = .php
catch_workers_output = yes
