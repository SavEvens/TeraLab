openapi: 3.1.0
info:
  title: TeraLab API
  version: 1.6-dev
  description: |
    JSON API for TeraLab lab orchestration. State-changing requests require a
    session cookie and the `X-CSRF-Token` header returned by setup/login/me.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /
tags:
  - name: auth
  - name: labs
  - name: nodes
  - name: templates
  - name: images
  - name: jobs
  - name: system
  - name: users
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: teralab_session
  schemas:
    Error:
      type: object
      required: [code, status, message]
      properties:
        code: { type: integer }
        status: { type: string, enum: [error] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    Node:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [qemu, vpcs, iol, dynamips, text, picture] }
        template: { type: string }
        image: { type: string, description: "Portable image reference (never a path)" }
        iso: { type: string, description: "Portable image reference (never a path)" }
        console: { type: string, enum: [telnet, vnc] }
        cpu: { type: integer, minimum: 1 }
        ram: { type: integer, minimum: 64 }
        serial: { type: integer, minimum: 0, maximum: 8 }
        nvram: { type: integer, minimum: 0, maximum: 4096 }
        delay: { type: integer, minimum: 0 }
        sat: { type: integer }
        nic: { type: string }
        config: { type: string }
        left: { type: integer }
        top: { type: integer }
        attributes: { type: object, additionalProperties: { type: string } }
        extra_xml: { type: array, items: { type: string } }
        interfaces:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              type: { type: string }
              network_id: { type: string }
              attributes: { type: object, additionalProperties: { type: string } }
    Image:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [qemu, iso, iol, dynamips] }
        name: { type: string }
        reference: { type: string, description: "Portable image reference used by lab files" }
        path: { type: string, description: "Absolute path inside the image store" }
        sha256: { type: string }
        size: { type: integer }
        virtual_size: { type: integer }
        format: { type: string }
        backing_file: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        template: { type: string, nullable: true }
        external:
          type: integer
          enum: [0, 1]
          description: "1 when the store entry is a symlink to a file that stays outside the store (adopted legacy addon)"
        created_at: { type: integer }
    DockerImage:
      type: object
      description: |
        A container image already pulled on the agent host, as displayed by
        `docker image ls`. All values are display strings; the API never parses
        them back into a reference or a byte count.
      required: [reference, id, size, created]
      properties:
        reference:
          type: string
          description: "Container reference (`repository:tag`) usable as a docker node image"
        id:
          type: string
          description: "Local image id, for example `sha256:…`"
        size:
          type: string
          description: "Human-readable size from docker, for example `158MB`"
        created:
          type: string
          description: "Creation timestamp as reported by docker"
    Lab:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        owner: { type: string }
        path: { type: string }
        description: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        nodes: { type: integer }
        networks: { type: integer }
        node_list: { type: array, items: { $ref: '#/components/schemas/Node' } }
        network_list: { type: array, items: { type: object } }
        lock: { type: object, nullable: true }
        running: { type: boolean }
        running_nodes: { type: integer }
        format: { type: string, enum: [legacy, eve-ng, teralab-2] }
        warnings:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              message: { type: string }
              node: { type: string }
              network: { type: string }
              value: { type: string }
    LabYamlWarning:
      type: object
      description: |
        A compile/import warning shared with `.unl` import. Warnings never block
        an import or apply.
      required: [type, message]
      properties:
        type:
          type: string
          description: "For YAML labs: image_unmapped, image_missing, network_unsupported, or node_unsupported"
        message: { type: string }
        node: { type: string, description: "Node name, when the warning is node-specific" }
        network: { type: string, description: "Network id, when the warning is network-specific" }
        value: { type: string, description: "Offending image reference or network type" }
    LabYamlCounts:
      type: object
      required: [nodes, networks, links]
      properties:
        nodes:
          type: integer
          minimum: 0
          description: Compiled node count
        networks:
          type: integer
          minimum: 0
          description: Compiled network count before the link invariant prunes networks with fewer than two attachments
        links:
          type: integer
          minimum: 0
          description: Number of cabled interface ends; a point-to-point entry contributes 2
    LabYamlValidateRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: "The full YAML document (max 10 MB); see docs/LAB-YAML.md"
        filename:
          type: string
          description: "Optional source file name for diagnostics; defaults to lab.yaml"
    LabYamlValidation:
      type: object
      required: [valid, errors, warnings, counts]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
          description: "The first compile error, when valid is false"
        warnings:
          type: array
          items: { $ref: '#/components/schemas/LabYamlWarning' }
        counts: { $ref: '#/components/schemas/LabYamlCounts' }
    LabYamlValidateResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        data: { $ref: '#/components/schemas/LabYamlValidation' }
    LabYamlApplyRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: "The full YAML document (max 10 MB); see docs/LAB-YAML.md"
        filename:
          type: string
          description: "Optional provenance file name; when omitted the existing name is kept"
        revision:
          type: integer
          minimum: 1
          description: "Optional expected revision; a mismatch returns 409"
    LabYamlApplyResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        data: { $ref: '#/components/schemas/Lab' }
        meta:
          type: object
          properties:
            warnings:
              type: array
              items: { $ref: '#/components/schemas/LabYamlWarning' }
    User:
      type: object
      description: |
        An account as returned by the admin user endpoints. Password hashes are
        never included.
      required: [id, username, role, expiration]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        role: { type: string, enum: [admin, editor, user] }
        expiration:
          type: integer
          description: "`-1` for no expiry, otherwise a unix timestamp"
        created_at: { type: integer }
        updated_at: { type: integer }
        session_count: { type: integer, minimum: 0 }
        last_seen_at: { type: integer, nullable: true }
        lab_count: { type: integer, minimum: 0 }
    UserListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
            password:
              type: string
              description: "Generated password, returned once; absent when the request supplied one"
    UserCreateRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$'
        role: { type: string, enum: [admin, editor, user] }
        email: { type: string, format: email, nullable: true }
        name: { type: string, maxLength: 128, nullable: true }
        password:
          type: string
          description: "Omitted or empty to generate one; a supplied password is never echoed"
        expiration:
          type: integer
          nullable: true
          description: "`-1` or `null` means never, otherwise a unix timestamp"
          default: -1
    UserUpdateRequest:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        name: { type: string, maxLength: 128, nullable: true }
        expiration:
          type: integer
          nullable: true
          description: "`-1` or `null` means never (null is normalised to `-1`); otherwise a unix timestamp"
        role:
          type: string
          enum: [admin, editor, user]
          description: "The last administrator cannot be demoted"
    UserPasswordResetRequest:
      type: object
      properties:
        password:
          type: string
          description: "Omitted or empty to generate one; a supplied password is never echoed"
    UserPasswordResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            password:
              type: string
              nullable: true
              description: "Present only when the reset generated the password; absent when the request supplied one"
    UserSessionsRevokeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revoked]
          properties:
            revoked: { type: integer, minimum: 0 }
    UserDeleteRequest:
      type: object
      properties:
        delete_labs:
          type: boolean
          default: false
          description: "Move the user's labs to the 30-day trash instead of keeping them"
    UserDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [deleted, labs_trashed]
          properties:
            deleted: { type: boolean, enum: [true] }
            labs_trashed: { type: integer, minimum: 0 }
paths:
  /api/v2/health:
    get:
      tags: [system]
      summary: Liveness and product version
      security: []
      responses:
        '200': { description: Health }
  /api/v2/version:
    get:
      tags: [system]
      summary: Product, licence, source, and component notices
      security: []
      responses:
        '200': { description: Version }
  /api/v2/system/host:
    get:
      tags: [system]
      summary: Host load, disk, nodes, and engine versions
      responses:
        '200': { description: Host status }
  /api/v2/setup:
    post:
      tags: [auth]
      summary: Create the initial administrator (one time)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string }
      responses:
        '201': { description: Administrator created }
        '409': { description: Setup already completed }
  /api/v2/auth/login:
    post:
      tags: [auth]
      summary: Create a session and return the CSRF token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Session cookie and CSRF token }
        '401': { description: Invalid credentials }
  /api/v2/auth/me:
    get:
      tags: [auth]
      summary: Current user and CSRF token
      responses:
        '200': { description: Current user }
  /api/v2/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        '200': { description: Logged out }
  /api/v2/auth/password:
    post:
      tags: [auth]
      summary: Change the current password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Password changed }
        '403': { description: Current password incorrect }
  /api/v2/users:
    get:
      tags: [users]
      summary: List users with session and lab counts (admin)
      description: |
        Administrator only. Accounts are returned without password hashes,
        together with their active session and owned-lab counts.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
    post:
      tags: [users]
      summary: Create a user (admin)
      description: |
        Administrator only, with CSRF. Omit `password` to generate one; the
        generated value is returned once in `data.password`. A supplied password
        is validated against the policy and never echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created; includes the generated password when one was generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreatedResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '422': { description: "Invalid input, weak password, or duplicate username" }
  /api/v2/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [users]
      summary: Update a user's email, name, expiration, or role (admin)
      description: |
        Administrator only, with CSRF. Changing your own role returns 409, as
        does demoting the last administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '409': { description: Self role change or last administrator }
        '422': { description: Invalid input }
    delete:
      tags: [users]
      summary: Delete a user (admin)
      description: |
        Administrator only, with CSRF. Labs are kept by default and become
        ownerless; `delete_labs` moves them to the 30-day lab trash. Deletion
        fails with 409 for yourself, the last administrator, or when
        `delete_labs` is set and an owned lab has running nodes. The user's
        sessions, permissions, lab locks, and API tokens are removed.
      parameters:
        - { name: delete_labs, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserDeleteRequest' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDeleteResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '409': { description: "Self deletion, last administrator, or running labs" }
        '422': { description: Invalid delete_labs value }
  /api/v2/users/{id}/password:
    post:
      tags: [users]
      summary: Set or generate a user's password (admin)
      description: |
        Administrator only, with CSRF. Omit `password` to generate one. A
        generated password is returned once in `data.password`; an admin-typed
        password is never echoed. All sessions of the target user are revoked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPasswordResetRequest' }
      responses:
        '200':
          description: "Password set; the generated password is returned once when one was generated"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPasswordResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '422': { description: Password does not meet the policy }
  /api/v2/users/{id}/sessions/revoke:
    post:
      tags: [users]
      summary: Revoke all sessions of a user (admin)
      description: Administrator only, with CSRF. Used for force-logout.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSessionsRevokeResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
  /api/v2/labs:
    get:
      tags: [labs]
      summary: List labs visible to the current user
      responses:
        '200':
          description: Labs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lab' } }
    post:
      tags: [labs]
      summary: Create a lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                body: { type: string }
                nodes: { type: array, items: { $ref: '#/components/schemas/Node' } }
                networks: { type: array, items: { type: object } }
      responses:
        '201': { description: Created }
        '422': { description: Validation error }
  /api/v2/labs/import:
    post:
      tags: [labs]
      summary: Import a .unl or YAML lab
      description: |
        Multipart upload in the `file` field. A `.yaml`/`.yml` extension selects
        the YAML compiler; `.unl` selects the XML parser; any other extension is
        sniffed (the first non-whitespace byte `<` means XML, otherwise YAML). A
        failing XML parse of a non-XML-looking file is retried as YAML; when both
        fail the 422 message contains both errors, prefixed `XML:` and `YAML:`.

        Imported YAML labs are created through the normal create pipeline (new
        id, revision 1, uploader as owner, YAML `author` when present) and carry
        a `source` marker in the lab's `<extensions>` block. See
        docs/LAB-YAML.md.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "A `.unl`, `.yaml`, or `.yml` lab file (max 10 MB)"
      responses:
        '201':
          description: Imported (legacy TeraLab, UNetLab, EVE-NG, TeraLab v2, or YAML)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { $ref: '#/components/schemas/Lab' }
                  meta:
                    type: object
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/LabYamlWarning' }
        '403': { description: Editor role or CSRF required }
        '413': { description: Request body too large }
        '422': { description: "Empty/oversized file, or a YAML compile error; ambiguous XML+YAML failures include both messages" }
  /api/v2/labs/validate:
    post:
      tags: [labs]
      summary: Dry-run compile a YAML lab (no writes)
      description: |
        Requires the editor role and CSRF. Compiles and resolves templates but
        writes nothing. Returns HTTP 200 even for an invalid document; `valid`
        is false and `errors` holds the first compile error. `counts.networks`
        is the compiled count before the link invariant prunes networks with
        fewer than two attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabYamlValidateRequest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabYamlValidateResponse' }
        '403': { description: Editor role or CSRF required }
        '413': { description: Request body too large }
        '422': { description: "Missing/non-string yaml, or non-text filename" }
  /api/v2/labs/trash:
    get:
      tags: [labs]
      summary: List trashed labs
      responses:
        '200': { description: Trash }
  /api/v2/labs/trash/{id}:
    delete:
      tags: [labs]
      summary: Permanently delete a trashed lab
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Purged }
  /api/v2/labs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [labs]
      summary: Lab metadata and topology
      responses:
        '200': { description: Lab }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      tags: [labs]
      summary: Save a lab with revision conflict detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Lab'
                - type: object
                  properties:
                    revision: { type: integer }
      responses:
        '200': { description: Saved }
        '409': { description: Revision conflict or running-lab lock }
    delete:
      tags: [labs]
      summary: Move a stopped lab to trash
      responses:
        '200': { description: Trashed }
  /api/v2/labs/{id}/apply:
    post:
      tags: [labs]
      summary: Replace a stopped lab's topology and metadata from YAML
      description: |
        Requires the editor role, CSRF, and access to the lab. Compiles the YAML
        with the same compiler as import and replaces the lab wholesale while
        preserving its id, path/folder, owner, and created_at. Revision is
        incremented by one, the YAML provenance marker is restamped, and node
        ids removed by the new topology are stopped and wiped. Every node must
        be stopped first; otherwise 409.

        Pass `revision` to make the call conditional. A mismatch returns 409
        with `details.revision` set to the current revision. Compile errors
        return 422. See docs/LAB-YAML.md.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabYamlApplyRequest' }
      responses:
        '200':
          description: Applied; the refreshed lab metadata and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabYamlApplyResponse' }
        '403': { description: "Editor role, CSRF, or lab access denied" }
        '404': { description: Lab not found }
        '409': { description: "A node is running or the supplied revision is stale" }
        '422': { description: "Missing/non-string yaml, bad filename/revision type, or YAML compile error" }
  /api/v2/labs/{id}/export:
    get:
      tags: [labs]
      summary: Export a .unl file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: XML export
          content:
            application/xml:
              schema: { type: string }
  /api/v2/labs/{id}/start:
    post:
      tags: [labs]
      summary: Create networks and start all engine nodes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Started with job_id }
  /api/v2/labs/{id}/stop:
    post:
      tags: [labs]
      summary: Stop all nodes and remove lab bridges
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stopped }
  /api/v2/labs/{id}/wipe:
    post:
      tags: [labs]
      summary: Stop, wipe node state, and remove bridges
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Wiped }
