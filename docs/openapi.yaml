openapi: 3.1.0
info:
  title: TeraLab API
  version: 1.6-dev
  description: |
    JSON API for TeraLab lab orchestration. State-changing requests require a
    session cookie and the `X-CSRF-Token` header returned by setup, login,
    guest entry, or `/auth/me`. Setup, login, and guest entry are public.

    The legacy v1 adapter (`/api/auth`, `/api/status`, `/api/folders`,
    `/api/labs`) is registered only when `legacy_v1_enabled=1` (default `0`).
    When enabled it is read-only: node actions and lab mutations return 405,
    and lab/folder reads are filtered by the same per-lab access rules as v2.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /
tags:
  - name: auth
  - name: labs
  - name: nodes
  - name: templates
  - name: images
  - name: jobs
  - name: system
  - name: users
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: teralab_session
  schemas:
    Error:
      type: object
      required: [code, status, message]
      properties:
        code: { type: integer }
        status: { type: string, enum: [error] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    Node:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [qemu, vpcs, iol, dynamips, text, picture] }
        template: { type: string }
        image: { type: string, description: "Portable image reference (never a path)" }
        iso: { type: string, description: "Portable image reference (never a path)" }
        console: { type: string, enum: [telnet, vnc] }
        cpu: { type: integer, minimum: 1 }
        ram: { type: integer, minimum: 64 }
        serial: { type: integer, minimum: 0, maximum: 8 }
        nvram: { type: integer, minimum: 0, maximum: 4096 }
        delay: { type: integer, minimum: 0 }
        sat: { type: integer }
        nic: { type: string }
        config: { type: string }
        left: { type: integer }
        top: { type: integer }
        attributes: { type: object, additionalProperties: { type: string } }
        extra_xml: { type: array, items: { type: string } }
        interfaces:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              type: { type: string }
              network_id: { type: string }
              attributes: { type: object, additionalProperties: { type: string } }
    Image:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [qemu, iso, iol, dynamips] }
        name: { type: string }
        reference: { type: string, description: "Portable image reference used by lab files" }
        path: { type: string, description: "Absolute path inside the image store" }
        sha256: { type: string }
        size: { type: integer }
        virtual_size: { type: integer }
        format: { type: string }
        backing_file: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        template: { type: string, nullable: true }
        external:
          type: integer
          enum: [0, 1]
          description: "1 when the store entry is a symlink to a file that stays outside the store (adopted legacy addon)"
        created_at: { type: integer }
    DockerImage:
      type: object
      description: |
        A container image reference already pulled on the agent host. Only the
        reference is exposed to the browser; local image ids, sizes, timestamps,
        and Docker host paths are never returned.
      required: [reference]
      properties:
        reference:
          type: string
          description: "Container reference (`repository:tag`) usable as a docker node image"
    ConsoleSession:
      type: object
      required: [kind, token, expires_in, ws_path]
      properties:
        kind: { type: string, enum: [telnet, vnc] }
        token: { type: string, description: "Short-lived console capability; plan 07 moves it out of the URL query" }
        expires_in: { type: integer }
        ws_path: { type: string, description: "WebSocket path, currently carrying the token as a query parameter" }
        password: { type: string, description: "Generated VNC password when kind is vnc" }
        port: { type: integer, description: "TCP proxy port when the agent returns one" }
    NodeStatus:
      type: object
      description: Agent-reported state and resource usage for one lab node.
      additionalProperties: true
      properties:
        id: { type: string }
        state: { type: string }
        ready: { type: boolean }
        memory_bytes: { type: integer }
        cpu_usage_usec: { type: integer }
        uptime_seconds: { type: integer }
        last_activity: { type: integer, nullable: true }
    Lab:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        owner: { type: string }
        path: { type: string }
        description: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        nodes: { type: integer }
        networks: { type: integer }
        node_list: { type: array, items: { $ref: '#/components/schemas/Node' } }
        network_list: { type: array, items: { type: object } }
        lock: { type: object, nullable: true }
        running: { type: boolean }
        running_nodes: { type: integer }
        format: { type: string, enum: [legacy, eve-ng, teralab-2] }
        warnings:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              message: { type: string }
              node: { type: string }
              network: { type: string }
              value: { type: string }
    LabYamlWarning:
      type: object
      description: |
        A compile/import warning shared with `.unl` import. Warnings never block
        an import or apply.
      required: [type, message]
      properties:
        type:
          type: string
          description: |
            For YAML labs: image_unmapped, image_missing, network_unsupported,
            or node_unsupported. A `.unl` import by a demo guest adds
            demo_limited when a node's RAM was clamped to the demo cap.
        message: { type: string }
        node: { type: string, description: "Node name, when the warning is node-specific" }
        network: { type: string, description: "Network id, when the warning is network-specific" }
        value: { type: string, description: "Offending image reference or network type" }
    LabYamlCounts:
      type: object
      required: [nodes, networks, links]
      properties:
        nodes:
          type: integer
          minimum: 0
          description: Compiled node count
        networks:
          type: integer
          minimum: 0
          description: Compiled network count before the link invariant prunes networks with fewer than two attachments
        links:
          type: integer
          minimum: 0
          description: Number of cabled interface ends; a point-to-point entry contributes 2
    LabYamlValidateRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: "The full YAML document (max 10 MB); see docs/LAB-YAML.md"
        filename:
          type: string
          description: "Optional source file name for diagnostics; defaults to lab.yaml"
    LabYamlValidation:
      type: object
      required: [valid, errors, warnings, counts]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
          description: "The first compile error, when valid is false"
        warnings:
          type: array
          items: { $ref: '#/components/schemas/LabYamlWarning' }
        counts: { $ref: '#/components/schemas/LabYamlCounts' }
    LabYamlValidateResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        data: { $ref: '#/components/schemas/LabYamlValidation' }
    LabYamlApplyRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: "The full YAML document (max 10 MB input; the compiled .unl is also capped at 10 MB); see docs/LAB-YAML.md"
        filename:
          type: string
          description: "Optional provenance file name; when omitted the existing name is kept"
        revision:
          type: integer
          minimum: 1
          description: "Optional expected revision; a mismatch returns 409"
    LabYamlApplyResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        data: { $ref: '#/components/schemas/Lab' }
        meta:
          type: object
          properties:
            warnings:
              type: array
              items: { $ref: '#/components/schemas/LabYamlWarning' }
    User:
      type: object
      description: |
        An account as returned by the admin user endpoints. Password hashes are
        never included.
      required: [id, username, role, expiration]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        role: { type: string, enum: [admin, editor, user] }
        expiration:
          type: integer
          description: "`-1` for no expiry, otherwise a unix timestamp"
        created_at: { type: integer }
        updated_at: { type: integer }
        session_count: { type: integer, minimum: 0 }
        last_seen_at: { type: integer, nullable: true }
        lab_count: { type: integer, minimum: 0 }
    UserListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
            password:
              type: string
              description: "Generated password, returned once; absent when the request supplied one"
    UserCreateRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$'
        role: { type: string, enum: [admin, editor, user] }
        email: { type: string, format: email, nullable: true }
        name: { type: string, maxLength: 128, nullable: true }
        password:
          type: string
          description: "Omitted or empty to generate one; a supplied password is never echoed"
        expiration:
          type: integer
          nullable: true
          description: "`-1` or `null` means never, otherwise a unix timestamp"
          default: -1
    UserUpdateRequest:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        name: { type: string, maxLength: 128, nullable: true }
        expiration:
          type: integer
          nullable: true
          description: "`-1` or `null` means never (null is normalised to `-1`); otherwise a unix timestamp"
        role:
          type: string
          enum: [admin, editor, user]
          description: "The last administrator cannot be demoted"
    UserPasswordResetRequest:
      type: object
      properties:
        password:
          type: string
          description: "Omitted or empty to generate one; a supplied password is never echoed"
    UserPasswordResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            password:
              type: string
              nullable: true
              description: "Present only when the reset generated the password; absent when the request supplied one"
    UserSessionsRevokeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revoked]
          properties:
            revoked: { type: integer, minimum: 0 }
    UserDeleteRequest:
      type: object
      properties:
        delete_labs:
          type: boolean
          default: false
          description: "Move the user's labs to the 30-day trash instead of keeping them"
    UserDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [deleted, labs_trashed]
          properties:
            deleted: { type: boolean, enum: [true] }
            labs_trashed: { type: integer, minimum: 0 }
paths:
  /api/v2/health:
    get:
      tags: [system]
      summary: Liveness, product version, and public feature flags
      description: |
        Public. `demo` and `turnstile` drive the sign-in page. The Turnstile
        secret is never included; only the public site key is returned.
      security: []
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                required: [status, version, php, time, demo, turnstile]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
                  php: { type: string }
                  time: { type: integer }
                  demo:
                    type: object
                    required: [enabled, landing, templates]
                    properties:
                      enabled: { type: boolean }
                      landing: { type: string, enum: [login, demo] }
                      templates:
                        type: array
                        items: { type: string }
                        description: |
                          Guest template allowlist in `demo_allowed_templates`
                          order. A configured id that names no installed
                          template may appear here; the guest guard and the
                          Add-node picker only use ids that resolve. Public;
                          contains no secret.
                  turnstile:
                    type: object
                    required: [enabled, site_key]
                    properties:
                      enabled: { type: boolean }
                      site_key:
                        type: string
                        description: "Public widget key; empty when it was cleared"
        '503': { description: Database unavailable }
  /api/v2/version:
    get:
      tags: [system]
      summary: Product, licence, source, and component notices
      security: []
      responses:
        '200': { description: Version }
  /api/v2/system/host:
    get:
      tags: [system]
      summary: Host load, disk, nodes, and engine versions (admin)
      description: |
        Admin-only. Exposes host interfaces, MAC/IP addresses, node run
        details, and engine versions.
      responses:
        '200': { description: Host status }
        '403': { description: Administrator role required }
  /api/v2/setup:
    post:
      tags: [auth]
      summary: Create the initial administrator (one time)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string }
      responses:
        '201': { description: Administrator created }
        '409': { description: Setup already completed }
  /api/v2/auth/login:
    post:
      tags: [auth]
      summary: Create a session and return the CSRF token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                cf-turnstile-response:
                  type: string
                  description: |
                    Cloudflare Turnstile token, required when `turnstile_enabled`
                    is 1. The `CF-Turnstile-Response` header is also accepted.
      responses:
        '200': { description: "Session cookie, user, CSRF token, and lifetime" }
        '401': { description: Invalid credentials }
        '422': { description: "Captcha rejected or unavailable; the credential check is not attempted" }
        '429': { description: "Captcha budget (20 per 15 minutes) or failed sign-ins (5 per 15 minutes for one username and address) exhausted" }
  /api/v2/auth/guest:
    post:
      tags: [auth]
      summary: Enter the public demo as a temporary guest
      description: |
        Public, like login: no session and no CSRF header. Creates a throwaway
        `editor` account (username `g-` plus 16 hex characters, no email, no
        name, no usable password) and returns the login session shape.

        Gate order: 404 when `demo_enabled` is 0, 403 when `demo_max_guests`
        sessions are active, then, when Turnstile is enabled, 429 if the captcha
        budget (20 per 15 minutes) is exhausted before 422 for a missing or
        rejected token. Finally 429 when the guest-entry budget (20 per hour) is
        exhausted. The concurrency check and the account creation are not
        atomic, so a burst can briefly exceed the cap; it protects steady state.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cf-turnstile-response:
                  type: string
                  description: |
                    Turnstile token when `turnstile_enabled` is 1. The
                    `CF-Turnstile-Response` header is also accepted.
      responses:
        '200':
          description: Guest session cookie, user, CSRF token, and lifetime
          content:
            application/json:
              schema:
                type: object
                required: [status, user, csrf_token, expires_in]
                properties:
                  status: { type: string, enum: [success] }
                  user:
                    type: object
                    required: [id, username, email, name, role, expiration, guest]
                    properties:
                      id: { type: string }
                      username:
                        type: string
                        pattern: '^g-[0-9a-f]{16}$'
                      email: { type: 'null' }
                      name: { type: 'null' }
                      role: { type: string, enum: [editor] }
                      expiration:
                        type: integer
                        description: "Unix timestamp: now plus `demo_guest_ttl_hours`"
                      guest: { type: boolean, enum: [true] }
                  csrf_token: { type: string }
                  expires_in:
                    type: integer
                    description: "Seconds until the session expires: the smaller of `session_ttl` and the time left until the guest account expires"
        '403': { description: The demo is full }
        '404': { description: The demo is disabled }
        '422': { description: "Captcha rejected or unavailable; entry fails closed" }
        '429':
          description: |
            Rate limited. An exhausted captcha budget answers `Too many captcha
            attempts. Try again later.`; an exhausted guest-entry budget answers
            `Too many demo entries from this network. Try again later.`
  /api/v2/auth/me:
    get:
      tags: [auth]
      summary: Current user and CSRF token
      responses:
        '200': { description: Current user }
  /api/v2/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        '200': { description: Logged out }
  /api/v2/auth/password:
    post:
      tags: [auth]
      summary: Change the current password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Password changed }
        '403': { description: Current password incorrect }
  /api/v2/users:
    get:
      tags: [users]
      summary: List users with session and lab counts (admin)
      description: |
        Administrator only. Accounts are returned without password hashes,
        together with their active session and owned-lab counts.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
    post:
      tags: [users]
      summary: Create a user (admin)
      description: |
        Administrator only, with CSRF. Omit `password` to generate one; the
        generated value is returned once in `data.password`. A supplied password
        is validated against the policy and never echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created; includes the generated password when one was generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreatedResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '422': { description: "Invalid input, weak password, or duplicate username" }
  /api/v2/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [users]
      summary: Update a user's email, name, expiration, or role (admin)
      description: |
        Administrator only, with CSRF. Changing your own role returns 409, as
        does demoting the last administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '409': { description: Self role change or last administrator }
        '422': { description: Invalid input }
    delete:
      tags: [users]
      summary: Delete a user (admin)
      description: |
        Administrator only, with CSRF. Labs are kept by default and become
        ownerless; `delete_labs` moves them to the 30-day lab trash. Deletion
        fails with 409 for yourself, the last administrator, or when
        `delete_labs` is set and an owned lab has running nodes. The user's
        sessions, permissions, lab locks, and API tokens are removed.
      parameters:
        - { name: delete_labs, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserDeleteRequest' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDeleteResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '409': { description: "Self deletion, last administrator, or running labs" }
        '422': { description: Invalid delete_labs value }
  /api/v2/users/{id}/password:
    post:
      tags: [users]
      summary: Set or generate a user's password (admin)
      description: |
        Administrator only, with CSRF. Omit `password` to generate one. A
        generated password is returned once in `data.password`; an admin-typed
        password is never echoed. All sessions of the target user are revoked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPasswordResetRequest' }
      responses:
        '200':
          description: "Password set; the generated password is returned once when one was generated"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPasswordResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '422': { description: Password does not meet the policy }
  /api/v2/users/{id}/sessions/revoke:
    post:
      tags: [users]
      summary: Revoke all sessions of a user (admin)
      description: Administrator only, with CSRF. Used for force-logout.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSessionsRevokeResponse' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
  /api/v2/labs:
    get:
      tags: [labs]
      summary: List labs visible to the current user
      description: |
        Runs a due demo sweep first, at most once per `demo_sweep_interval`
        seconds, so expired guests and idle guest labs are reclaimed without a
        cron job or timer. Admin and non-guest editor labs are never swept. A
        sweep failure is logged and does not fail this request. See
        docs/API.md.
      responses:
        '200':
          description: Labs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lab' } }
    post:
      tags: [labs]
      summary: Create a lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                body: { type: string }
                nodes: { type: array, items: { $ref: '#/components/schemas/Node' } }
                networks: { type: array, items: { type: object } }
      responses:
        '201': { description: Created }
        '422': { description: "Validation error, link invariant, or guest demo limit (node count, template, or RAM)" }
  /api/v2/labs/import:
    post:
      tags: [labs]
      summary: Import a .unl or YAML lab
      description: |
        Multipart upload in the `file` field. A `.yaml`/`.yml` extension selects
        the YAML compiler; `.unl` selects the XML parser; any other extension is
        sniffed (the first non-whitespace byte `<` means XML, otherwise YAML). A
        failing XML parse of a non-XML-looking file is retried as YAML; when both
        fail the 422 message contains both errors, prefixed `XML:` and `YAML:`.

        Imported YAML labs are created through the normal create pipeline (new
        id, revision 1, uploader as owner, YAML `author` when present) and carry
        a `source` marker in the lab's `<extensions>` block. See
        docs/LAB-YAML.md.

        The 10 MB YAML input cap is separate from the 10 MB compiled `.unl` cap.
        A YAML under 10 MB that would serialize to a larger `.unl` (base64
        configs, topology XML, and the embedded source all count) is rejected
        with 422 before a lab is created.

        A demo guest is capped per lab: at most `demo_max_nodes_per_lab` nodes,
        engine nodes may only use templates from `demo_allowed_templates` that
        are installed, and at most `demo_max_ram_per_node` MB per node. A `.unl`
        import over the
        node-count or template cap returns 422; an over-cap RAM value is clamped
        to the cap and reported as a `demo_limited` warning in `data.warnings`
        and `meta.warnings`. YAML import compiles through the create pipeline,
        so it rejects instead of clamping. Admin and non-guest editor accounts
        are exempt. See docs/API.md.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "A `.unl`, `.yaml`, or `.yml` lab file (max 10 MB input; a compiled YAML lab is also capped at 10 MB)"
      responses:
        '201':
          description: Imported (legacy TeraLab, UNetLab, EVE-NG, TeraLab v2, or YAML)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { $ref: '#/components/schemas/Lab' }
                  meta:
                    type: object
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/LabYamlWarning' }
        '403': { description: Editor role or CSRF required }
        '413': { description: Request body too large }
        '422': { description: "Empty/oversized file, YAML compile error, compiled .unl over 10 MB, or a guest demo node-count/template violation; ambiguous XML+YAML failures include both messages" }
  /api/v2/labs/validate:
    post:
      tags: [labs]
      summary: Dry-run compile a YAML lab (no writes)
      description: |
        Requires the editor role and CSRF. Compiles and resolves templates but
        writes nothing. Returns HTTP 200 even for an invalid document; `valid`
        is false and `errors` holds the first compile error. `counts.networks`
        is the compiled count before the link invariant prunes networks with
        fewer than two attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabYamlValidateRequest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabYamlValidateResponse' }
        '403': { description: Editor role or CSRF required }
        '413': { description: Request body too large }
        '422': { description: "Missing/non-string yaml, or non-text filename" }
  /api/v2/labs/trash:
    get:
      tags: [labs]
      summary: List trashed labs
      responses:
        '200': { description: Trash }
  /api/v2/labs/trash/{id}:
    delete:
      tags: [labs]
      summary: Permanently delete a trashed lab
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Purged }
  /api/v2/labs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [labs]
      summary: Lab metadata and topology
      responses:
        '200': { description: Lab }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      tags: [labs]
      summary: Save a lab with revision conflict detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Lab'
                - type: object
                  properties:
                    revision: { type: integer }
      responses:
        '200': { description: Saved }
        '409': { description: Revision conflict or running-lab lock }
        '422': { description: "Validation error, link invariant, or guest demo limit when nodes are sent" }
    delete:
      tags: [labs]
      summary: Move a stopped lab to trash
      responses:
        '200': { description: Trashed }
  /api/v2/labs/{id}/apply:
    post:
      tags: [labs]
      summary: Replace a stopped lab's topology and metadata from YAML
      description: |
        Requires the editor role, CSRF, and access to the lab. Compiles the YAML
        with the same compiler as import and replaces the lab wholesale while
        preserving its id, path/folder, owner, and created_at. Revision is
        incremented by one and the YAML provenance marker is restamped. Every
        node must be stopped first; otherwise 409.

        Node run directories are keyed by compiled node id (declaration order).
        Apply uses the node name to verify identity: it keeps run dirs only when
        every surviving old id still names the same node, and wipes old ids
        removed from the topology. If a reorder or rename makes a surviving id
        refer to a different node, apply wipes all old node run directories
        before writing to prevent cross-inheritance.

        The compiled `.unl` must also be at most 10 MB (separate from the YAML
        input cap); a larger result returns 422 before anything is written.

        Pass `revision` to make the call conditional. A mismatch returns 409
        with `details.revision` set to the current revision. Compile errors
        return 422. See docs/LAB-YAML.md.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabYamlApplyRequest' }
      responses:
        '200':
          description: Applied; the refreshed lab metadata and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabYamlApplyResponse' }
        '403': { description: "Editor role, CSRF, or lab access denied" }
        '404': { description: Lab not found }
        '409': { description: "A node is running or the supplied revision is stale" }
        '422': { description: "Missing/non-string yaml, bad filename/revision type, YAML compile error, compiled .unl over 10 MB, or a guest demo limit" }
  /api/v2/labs/{id}/export:
    get:
      tags: [labs]
      summary: Export a .unl file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: XML export
          content:
            application/xml:
              schema: { type: string }
  /api/v2/labs/{id}/start:
    post:
      tags: [labs]
      summary: Create networks and start all engine nodes
      description: |
        Re-checks the lab's current topology against the demo caps for a guest
        before any agent call, so a lab authored while a cap was higher refuses
        to start after the cap is lowered.

        A guest start runs a due demo sweep first, then refuses with 409 when
        host memory is below `demo_memory_floor_mb`. Admin and non-guest editor
        starts are unaffected.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Started with job_id }
        '409': { description: "Guest start at capacity: The demo is at capacity right now; try again shortly." }
        '422': { description: "Guest demo limit: node count, template, or RAM" }
  /api/v2/labs/{id}/stop:
    post:
      tags: [labs]
      summary: Stop all nodes and remove lab bridges
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stopped }
  /api/v2/labs/{id}/wipe:
    post:
      tags: [labs]
      summary: Stop, wipe node state, and remove bridges
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Wiped }
  /api/v2/labs/{id}/duplicate:
    post:
      tags: [labs]
      summary: Duplicate topology into a new lab
      description: |
        For a demo guest the source lab's stored nodes are checked against the
        demo caps before the copy is written; an over-cap source returns 422
        and no copy is created.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Duplicated }
        '422': { description: "Guest demo limit on the source lab's nodes" }
  /api/v2/labs/{id}/nodes:
    get:
      tags: [nodes]
      summary: Per-node agent state
      description: |
        Agent-reported state per node. `last_activity` is Unix seconds of the
        last console read or write, or null when the agent has no value (for
        example when the node was never registered); it is in memory and is
        reset at an agent restart. The demo sweeper treats a null value as
        unknown, never as idle. See docs/API.md.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node states
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [lab_id, nodes]
                    properties:
                      lab_id: { type: string }
                      nodes:
                        type: array
                        items:
                          type: object
                          required: [node_id, agent_id, name, type, state, ready, last_activity]
                          properties:
                            node_id: { type: string }
                            agent_id: { type: string }
                            name: { type: string }
                            type: { type: string }
                            state: { type: string }
                            ready: { type: boolean }
                            last_activity:
                              type: integer
                              nullable: true
                              description: "Unix seconds of the last console read or write; null when unknown"
  /api/v2/labs/{id}/restore:
    post:
      tags: [labs]
      summary: Restore a trashed lab
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Restored }
  /api/v2/templates:
    get:
      tags: [templates]
      summary: List built-in and custom YAML templates
      responses:
        '200': { description: Templates }
  /api/v2/templates/import:
    post:
      tags: [templates]
      summary: Import a YAML template
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Imported }
        '403': { description: "Editor role or CSRF required, or a demo guest (template changes are disabled)" }
  /api/v2/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [templates]
      summary: Template YAML and parsed fields
      responses:
        '200': { description: Template }
    put:
      tags: [templates]
      summary: Create or update a custom template
      responses:
        '200': { description: Saved }
        '403': { description: "Editor role or CSRF required, or a demo guest (template changes are disabled)" }
    delete:
      tags: [templates]
      summary: Delete a custom template
      responses:
        '200': { description: Deleted }
        '403': { description: "Editor role or CSRF required, or a demo guest (template changes are disabled)" }
  /api/v2/templates/{id}/export:
    get:
      tags: [templates]
      summary: Export a template YAML file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: YAML }
  /api/v2/templates/{id}/duplicate:
    post:
      tags: [templates]
      summary: Duplicate a template
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Duplicated }
        '403': { description: "Editor role or CSRF required, or a demo guest (template changes are disabled)" }
  /api/v2/docker/images:
    get:
      tags: [images]
      summary: List locally pulled Docker image references (admin)
      description: |
        Admin-only, read-only suggestions for the node Inspector. Only
        container references are returned; local ids, display sizes, creation
        times, and Docker host paths are never exposed. The API never pulls,
        inspects or deletes a container image, and the image store is not
        involved.
      responses:
        '200':
          description: Locally pulled container images, sorted by reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DockerImage' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '502': { description: "Docker is unavailable, the agent cannot be reached, or the agent returned an invalid image list" }
  /api/v2/images:
    get:
      tags: [images]
      summary: List stored images
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Image' }
    post:
      tags: [images]
      summary: Upload an image with kind and optional name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [qemu, iso, iol, dynamips] }
                name: { type: string }
                file: { type: string, format: binary }
      responses:
        '201': { description: Stored }
        '403': { description: "Editor role or CSRF required, or a demo guest (image changes are disabled)" }
        '422': { description: Validation error }
  /api/v2/images/import:
    post:
      tags: [images]
      summary: Adopt images from a legacy addons tree (dry run or import)
      description: |
        Administrator only. A dry run reports every recognised image under
        `root` (default `/opt/unetlab/addons`). An import creates a symlink
        inside the image store for each selected file and registers it with
        `external = 1`; nothing is copied and the source tree is never
        modified. Licence files (`iourc`, `licence`, `license`) are never
        registered. A demo guest is refused first with the demo policy
        message; the admin role is enforced in the controller, so non-guests
        get the same admin-only result as before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                root:
                  type: string
                  default: /opt/unetlab/addons
                  description: Absolute path of the addons tree to scan.
                dry_run:
                  type: boolean
                  default: true
                  description: When false, `files` is required and symlinks are created.
                files:
                  type: array
                  description: Relative paths under `root`; required when `dry_run` is false.
                  items: { type: string }
                templates:
                  type: object
                  description: Optional template ids keyed by relative path.
                  additionalProperties: { type: string }
      responses:
        '200': { description: Dry-run entries or import results }
        '401': { description: Authentication required }
        '403': { description: "Administrator role required, or a demo guest (image changes are disabled)" }
        '422': { description: Invalid root or request body }
  /api/v2/images/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [images]
      summary: Image metadata
      responses:
        '200':
          description: Image
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Image' }
    patch:
      tags: [images]
      summary: Rename an image (name and/or portable reference)
      responses:
        '200': { description: Renamed }
        '403': { description: "Editor role or CSRF required, or a demo guest (image changes are disabled)" }
        '409': { description: Reference already in use }
    delete:
      tags: [images]
      summary: Delete an unreferenced image
      responses:
        '200': { description: Deleted }
        '403': { description: "Editor role or CSRF required, or a demo guest (image changes are disabled)" }
  /api/v2/images/{id}/template:
    put:
      tags: [images]
      summary: Map an image to a template
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Mapped }
        '403': { description: "Editor role or CSRF required, or a demo guest (image changes are disabled)" }
  /api/v2/jobs:
    get:
      tags: [jobs]
      summary: List recent jobs
      description: Admins see every job; other users see only jobs they created.
      responses:
        '200': { description: Jobs }
  /api/v2/jobs/{id}:
    get:
      tags: [jobs]
      summary: Job state and progress
      description: Admins may read any job; other users only their own.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Job }
        '403': { description: Job belongs to another user }
  /api/v2/jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a queued job
      description: Admins may cancel any job; other users only their own.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
        '403': { description: Job belongs to another user or CSRF is missing }
        '409': { description: Job cannot be cancelled safely }
  /api/v2/labs/{id}/snapshots:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [labs]
      summary: List lab snapshots
      responses:
        '200': { description: Snapshots }
    post:
      tags: [labs]
      summary: Create a topology/config snapshot
      responses:
        '201': { description: Snapshot created }
  /api/v2/labs/{id}/snapshots/{snapshot}/restore:
    post:
      tags: [labs]
      summary: Restore a lab snapshot
      description: |
        For a demo guest the snapshot's topology is checked against the demo
        caps before it is written back; an over-cap snapshot returns 422 and
        the lab is unchanged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: snapshot, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Restored }
        '422': { description: "Guest demo limit on the snapshot's topology" }
  /api/v2/labs/{id}/snapshots/{snapshot}:
    delete:
      tags: [labs]
      summary: Delete a snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: snapshot, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
  /api/v2/labs/{id}/nodes/{node}/start:
    post:
      tags: [nodes]
      summary: Start one lab node
      description: |
        Re-checks the lab's current topology against the demo caps for a guest
        before starting the node. Runs a due demo sweep first, then refuses with
        409 when host memory is below `demo_memory_floor_mb`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Running }
        '409': { description: "Guest start at capacity: The demo is at capacity right now; try again shortly." }
        '422': { description: "Guest demo limit: node count, template, or RAM" }
  /api/v2/labs/{id}/nodes/{node}/stop:
    post:
      tags: [nodes]
      summary: Stop one lab node
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stopped }
  /api/v2/labs/{id}/nodes/{node}/wipe:
    post:
      tags: [nodes]
      summary: Wipe one lab node
      description: |
        Requires the effective `edit` role on the canonical lab and
        `X-CSRF-Token`. The agent node id is derived from the authorized
        lab+node pair.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Wiped }
        '403': { description: "Lab edit role or CSRF required" }
  /api/v2/labs/{id}/nodes/{node}/console:
    post:
      tags: [nodes]
      summary: Issue a short-lived console token for one lab node
      description: |
        Requires the effective `edit` role on the canonical lab and
        `X-CSRF-Token`. The client sends no agent node id: the server resolves
        the node inside the authorized lab and derives the agent id.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Console kind, token, and WebSocket path
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ConsoleSession' }
        '403': { description: "Lab edit role or CSRF required" }
        '404': { description: Lab or node not found }
        '502': { description: The agent did not return a console token }
  /api/v2/labs/{id}/nodes/{node}/status:
    get:
      tags: [nodes]
      summary: Agent state and resource usage for one lab node
      description: |
        Requires the effective `read` role on the canonical lab. The agent
        node id is derived from the authorized lab+node pair. Prefer
        `GET /api/v2/labs/{id}/nodes` when the whole lab is needed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NodeStatus' }
        '403': { description: "Lab read role required" }
        '404': { description: Lab or node not found }
  /api/v2/system/status:
    get:
      tags: [system]
      summary: Database, user, and lab status
      responses:
        '200': { description: Status }
  /api/v2/system/logs:
    get:
      tags: [system]
      summary: Tail API or agent logs
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [api, agent] } }
      responses:
        '200': { description: Log lines }
  /api/v2/system/settings:
    get:
      tags: [system]
      summary: Read runtime settings
      responses:
        '200': { description: Settings }
    put:
      tags: [system]
      summary: Update runtime settings (admin)
      responses:
        '200': { description: Updated }
  /api/v2/system/demo/status:
    get:
      tags: [system]
      summary: Demo sweeper status (admin)
      description: |
        Administrator only. Read-only, so no `X-CSRF-Token` header is needed.
        The values are the ones the demo sweeper uses: the time of the last
        sweep, the host memory it compares with `demo_memory_floor_mb`, and the
        demo's size. `last_sweep_at` is null before the first sweep. See
        docs/API.md.
      responses:
        '200':
          description: Demo status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [last_sweep_at, mem_available_mb, guests_active, demo_nodes_running]
                    properties:
                      last_sweep_at:
                        type: integer
                        nullable: true
                        description: "Unix time of the last completed sweep; null before the first sweep"
                      mem_available_mb:
                        type: integer
                        nullable: true
                        description: "`MemAvailable` from /proc/meminfo, in MB; null when it cannot be read"
                      guests_active:
                        type: integer
                        minimum: 0
                        description: "Guest account rows (guest = 1), including expired ones no sweep has removed yet"
                      demo_nodes_running:
                        type: integer
                        minimum: 0
                        description: "Nodes currently running in guest-owned labs"
        '403': { description: Administrator role required }
  /api/v2/system/demo/sweep:
    post:
      tags: [system]
      summary: Run a demo sweep now (admin)
      description: |
        Administrator only, with CSRF. Ignores `demo_sweep_interval` and runs the
        guest sweep immediately: expired and idle guests are purged, idle guest
        labs are wiped, and the newest guest nodes are stopped while host memory
        is below `demo_memory_floor_mb`. A guest whose lab wipe fails is kept
        (with its sessions) for the next sweep and counted in `labs_failed`. Only
        guest resources are touched and images are never deleted. Counts are 0
        when nothing was reclaimed. The lazy sweep swallows its own errors, but
        this endpoint calls the sweeper directly, so a failure is returned here.
        This is the action behind **Sweep now** in System → Demo. See
        docs/API.md.
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    required: [guests_purged, labs_wiped, labs_failed, nodes_reaped, mem_available_mb]
                    properties:
                      guests_purged: { type: integer, minimum: 0 }
                      labs_wiped:
                        type: integer
                        minimum: 0
                        description: "Guest labs wiped by the purge and idle-wipe steps combined"
                      labs_failed:
                        type: integer
                        minimum: 0
                        description: "Guest labs whose wipe failed during a purge; the guest was kept for the next sweep"
                      nodes_reaped:
                        type: integer
                        minimum: 0
                        description: "Guest nodes stopped by the memory reaper"
                      mem_available_mb:
                        type: integer
                        nullable: true
                        description: "Host MemAvailable after the sweep; null when it cannot be read"
        '403': { description: Administrator role or invalid CSRF token }
  /api/v2/system/backup:
    get:
      tags: [system]
      summary: Download a backup archive (admin)
      responses:
        '200': { description: Zip backup }
  /api/v2/system/restore:
    post:
      tags: [system]
      summary: Restore labs, templates, settings, and image metadata (admin)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Restore result }
  /api/v2/system/tokens:
    get:
      tags: [system]
      summary: List the current user's API tokens
      responses:
        '200': { description: Tokens }
    post:
      tags: [system]
      summary: Create an API token
      responses:
        '201': { description: Token created; plaintext returned once }
  /api/v2/system/tokens/{id}:
    delete:
      tags: [system]
      summary: Revoke an API token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revoked }
