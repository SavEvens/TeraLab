#
# Same-origin WebSocket console proxy for the TeraLab agent.
#
# The agent gateway binds to 127.0.0.1:8091 only. Browsers connect to this
# virtual host path, and Apache forwards the upgrade to the agent. The API
# issues short-lived tokens at POST /api/v2/nodes/console and returns the
# matching /ws/console?token=... path.
#
# Include this file from the TeraLab virtual host after enabling
# mod_proxy and mod_proxy_wstunnel.

<IfModule mod_proxy_wstunnel.c>
    ProxyPass        /ws/console ws://127.0.0.1:8091/ws
    ProxyPassReverse /ws/console ws://127.0.0.1:8091/ws

    ProxyPass        /ws/vnc ws://127.0.0.1:8091/vnc
    ProxyPassReverse /ws/vnc ws://127.0.0.1:8091/vnc

    ProxyPass        /ws/tcp ws://127.0.0.1:8091/tcp
    ProxyPassReverse /ws/tcp ws://127.0.0.1:8091/tcp
</IfModule>
